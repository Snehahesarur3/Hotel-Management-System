# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# First create the database:  CREATE DATABASE hoteldb;
spring.datasource.url=jdbc:mysql://localhost:3306/hoteldb
spring.datasource.username=root
spring.datasource.password=your_password
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
# Sample data in data.sql is inserted on first run; on later runs duplicates are skipped
spring.sql.init.continue-on-error=true
